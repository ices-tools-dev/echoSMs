# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: |
  (?x)^(
    src/otherCode/|
    .*\.csv$
  )

repos:
  # A range of checks on project files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-json
    - id: check-toml
    - id: check-xml
    - id: detect-private-key
    - id: fix-byte-order-marker
    - id: check-added-large-files

  # Format pyproject.toml file
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 59e7b26529dc6f15c43063064b8b06ded60d0910 # v2.29.4
    hooks:
      - id: pyproject-fmt
        args: ["--keep-full-version", "--no-generate-python-version-classifiers"]

  # Check spelling in source code
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell
        args: ["--skip=src/otherCode,*.ipynb,*.pdf,*.svg", "-w", "docs", "src"]

  # Check Github Actions workflow checks
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  # Check for security issues in Github Action .yml files
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      - id: zizmor
        args: ["--pedantic"]

  # Check python coding using ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # v0.16.8
    hooks:
      - id: ruff-check
        args: ["--color", "always"]
      # - id: ruff-format
