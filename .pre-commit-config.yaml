# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: |
  (?x)^(
    src/otherCode/|
    .*\.csv$
  )

repos:
  # A range of checks on project files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-json
    - id: check-toml
    - id: check-xml
    - id: detect-private-key
    - id: fix-byte-order-marker
    - id: check-added-large-files

  # Format pyproject.toml file
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6 # v2.30.3
    hooks:
      - id: pyproject-fmt
        name: check pyproject.toml formatting
        args: ["--keep-full-version", "--no-generate-python-version-classifiers"]

  # Check spelling in source code
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell
        name: check spelling in code
        args: ["--skip=src/otherCode,*.ipynb,*.pdf,*.svg", "docs", "src"]

  # Check Github Actions workflow files
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        name: github Actions workflow lint checks

  # Check for security issues in Github Action .yml files
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
        name: github Actions security checks
        args: ["--pedantic"]

  # Check python coding using ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
    hooks:
      - id: ruff-check
        args: ["--color", "always"]
      # - id: ruff-format
