# Set update schedule for GitHub Actions

version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
